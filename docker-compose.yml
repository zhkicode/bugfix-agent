services:
  bugfixagent:
    # CI 推送到 GHCR 的镜像；本地手动部署时可 IMAGE=bugfixagent:latest docker compose up -d
    image: ${IMAGE:-ghcr.io/zhkicode/bugfix-agent:latest}
    container_name: bugfixagent
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - bugfix_data:/app/data            # SQLite + 加密密钥（含面板配置的 claude 认证）
      - bugfix_workspace:/app/workspace  # 修复用临时克隆
      - agent_home:/home/agent           # claude 运行状态
volumes:
  bugfix_data:
  bugfix_workspace:
  agent_home:
